<script>
const x=c.getContext('2d');let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
// ocean
const g=x.createRadialGradient(640,360,100,640,360,800);g.addColorStop(0,'#2e9aa3');g.addColorStop(1,'#1b6670');x.fillStyle=g;x.fillRect(0,0,1280,720);
x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=2;for(let i=0;i<140;i++){const a=rnd()*1280,b=rnd()*720;x.beginPath();x.moveTo(a,b);x.quadraticCurveTo(a+6,b-4,a+12,b);x.quadraticCurveTo(a+18,b+4,a+24,b);x.stroke()}
function blob(cx,cy,r,n,j,s){const pts=[];for(let i=0;i<n;i++){const a=i/n*6.283;const k=1+(Math.sin(i*2.3+s)*.5+Math.cos(i*1.7+s)*.5)*j;pts.push([cx+Math.cos(a)*r*k,cy+Math.sin(a)*r*k*.8])}return pts}
function path(p){x.beginPath();p.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath()}
function island(cx,cy,r,s,town,rock){
 path(blob(cx,cy+6,r*1.6,20,.12,s));x.fillStyle='rgba(120,220,210,.35)';x.fill();
 path(blob(cx,cy+4,r*1.3,20,.12,s));x.fillStyle='rgba(150,235,220,.35)';x.fill();
 path(blob(cx,cy+10,r*1.08,18,.12,s));x.fillStyle='#c9ab6e';x.fill();
 path(blob(cx,cy,r*1.08,18,.12,s));x.fillStyle='#f0d9a0';x.fill();
 path(blob(cx,cy+6,r*.8,16,.14,s+1));x.fillStyle='#4f8f36';x.fill();
 path(blob(cx,cy-4,r*.8,16,.14,s+1));x.fillStyle='#78bd52';x.fill();
 const items=[];
 if(rock)items.push(['rock',cx+r*.15,cy-r*.15]);
 for(let i=0;i<town;i++)items.push(['house',cx-r*.45+(i%3)*r*.35,cy-r*.35+Math.floor(i/3)*r*.4]);
 for(let i=0;i<6;i++){const a=rnd()*6.28,d=rnd()*r*.55;items.push(['tree',cx+Math.cos(a)*d,cy+Math.sin(a)*d*.7])}
 items.sort((a,b)=>a[2]-b[2]).forEach(([t,a,b])=>{
  x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(a+6,b+8,14,6,0,0,7);x.fill();
  if(t==='tree'){x.fillStyle='#7a4f27';x.fillRect(a-2,b-14,4,14);x.fillStyle='#2f7a34';x.beginPath();x.arc(a,b-18,11,0,7);x.fill();x.fillStyle='#4aa048';x.beginPath();x.arc(a-3,b-21,7,0,7);x.fill()}
  if(t==='house'){x.fillStyle='#d9c7a6';x.fillRect(a-12,b-12,24,14);x.fillStyle='#f4ead6';x.fillRect(a-12,b-22,24,12);x.fillStyle=rnd()>.5?'#c0533a':'#2f6f9f';x.beginPath();x.moveTo(a-15,b-20);x.lineTo(a,b-34);x.lineTo(a+15,b-20);x.fill();x.fillStyle='#5a3d22';x.fillRect(a-3,b-8,6,8)}
  if(t==='rock'){x.fillStyle='#5d5a57';path([[a-30,b+5],[a-18,b-30],[a+5,b-42],[a+28,b-18],[a+30,b+6]]);x.fill();x.fillStyle='#807b76';path([[a-18,b-30],[a+5,b-42],[a+8,b-10],[a-10,b]]);x.fill()}
 });
 if(town){x.fillStyle='#8f6237';x.fillRect(cx+r*.2,cy+r*.8,12,r*.7);x.fillStyle='#6d4625';x.fillRect(cx+r*.2,cy+r*.8+r*.7,12,6)}
}
function ship(cx,cy,ang,s,sail){
 x.save();x.translate(cx,cy);x.rotate(ang);x.scale(s,s);
 // wake
 const wg=x.createLinearGradient(0,20,0,140);wg.addColorStop(0,'rgba(240,255,255,.7)');wg.addColorStop(1,'rgba(240,255,255,0)');x.fillStyle=wg;x.beginPath();x.moveTo(-14,20);x.lineTo(-40,140);x.lineTo(40,140);x.lineTo(14,20);x.fill();
 x.fillStyle='rgba(0,0,0,.22)';x.beginPath();x.ellipse(8,10,22,46,0,0,7);x.fill();
 x.fillStyle='#6e3f1d';x.beginPath();x.moveTo(0,-50);x.quadraticCurveTo(26,-10,18,34);x.lineTo(-18,34);x.quadraticCurveTo(-26,-10,0,-50);x.fill();
 x.fillStyle='#c48d52';x.beginPath();x.moveTo(0,-42);x.quadraticCurveTo(19,-10,13,29);x.lineTo(-13,29);x.quadraticCurveTo(-19,-10,0,-42);x.fill();
 x.strokeStyle='rgba(90,55,25,.5)';x.lineWidth=1.5;for(let i=-30;i<28;i+=7){x.beginPath();x.moveTo(-16,i);x.lineTo(16,i);x.stroke()}
 x.fillStyle='#a8763c';[[-8,14],[3,14],[-3,22]].forEach(([a,b])=>{x.fillRect(a,b,9,8);x.strokeRect(a,b,9,8)});
 // sail (bellied by wind, seen from above at an angle)
 x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.moveTo(12,-12);x.quadraticCurveTo(58,0,30,40);x.lineTo(12,-12);x.fill();
 x.fillStyle=sail;x.beginPath();x.moveTo(0,-14);x.quadraticCurveTo(46,-6,24,34);x.lineTo(0,-14);x.fill();
 x.strokeStyle='#5b3a1e';x.lineWidth=4;x.beginPath();x.moveTo(0,-14);x.lineTo(24,34);x.stroke();
 x.fillStyle='#4a2e14';x.beginPath();x.arc(0,-14,5,0,7);x.fill();
 x.restore()}
island(230,230,120,1,6,0);island(1000,150,75,3,0,1);island(1000,600,105,5,4,0);island(70,690,70,7,0,1);island(1270,370,55,9,0,0);
ship(470,110,-2.0,.75,'#f6e0b0');ship(640,380,.6,1.15,'#f7f3e6');ship(1150,520,-.8,.8,'#d9e9f2');
x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;for(let i=0;i<22;i++){const a=rnd()*1280,b=rnd()*720;x.beginPath();x.moveTo(a,b);x.lineTo(a-38,b+38);x.stroke()}
const lab=(l,t,lvl,name,want)=>{const d=document.createElement('div');d.className='label';d.style.left=l+'px';d.style.top=t+'px';d.innerHTML=`<span class="lvl">${lvl}</span><span class="lb">${name}<small>${want}</small></span>`;labels.appendChild(d)};
lab(230,120,3,'Port Calda','wants Timber, Cloth');lab(1000,510,1,'Saltmere','wants Grain');
document.title='done';
</script></body></html>
