<!doctype html><html><head><meta charset="utf-8"><title>Rudder waterline inspection</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10343b;color:#fff;font:22px Arial;width:1600px}h1{font-size:28px;margin:0;padding:20px}.names{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:25px;padding:10px}canvas{display:block;width:1600px;height:600px}p{font-size:18px;margin:15px 22px;color:#c4dddd}</style></head><body><h1>Rudder immersion · waterline shown for inspection</h1><div class="names"><div>Fluyt</div><div>Indiaman</div></div><canvas></canvas><p>Hull shown translucent to reveal the attachment · the blue line marks calm water · full-size game geometry</p>
<script type="module">
import * as THREE from 'three';
import {BOAT_CLASSES} from '/src/render/models/storybookBoat.ts';
import {hullGeometry} from '/src/render/models/refinedBoat.ts';
import {STYLE_D} from '/src/render/models/boatStyle.ts';
import {fluytDetails} from '/src/render/models/fluytDetails.ts';
import {indiamanDetails} from '/src/render/models/indiamanDetails.ts';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true,preserveDrawingBuffer:true});renderer.setSize(1600,600,false);renderer.setScissorTest(true);
const measurements=[];
for(const [i,id] of ['fluyt','indiaman'].entries()){
 const cls=BOAT_CLASSES[id],L=cls.L,H=cls.H*STYLE_D.H;
 const deckAt=z=>H*.55+STYLE_D.sheer*Math.sqrt(L/5)*(z/(L/2))**2;
 const scene=new THREE.Scene();scene.background=new THREE.Color('#235761');
 scene.add(new THREE.HemisphereLight('#d4f0f0','#304454',2));const sun=new THREE.DirectionalLight('#fff0d0',2);sun.position.set(12,20,-10);scene.add(sun);
 const hull=hullGeometry(3,{length:L,beam:cls.B,depth:cls.H,hull:cls.hull,band:cls.band,hullShape:cls.hullShape});
 scene.add(new THREE.Mesh(hull,new THREE.MeshLambertMaterial({vertexColors:true,transparent:true,opacity:.3,depthWrite:false,side:THREE.DoubleSide})));
 const parts=(id==='fluyt'?fluytDetails:indiamanDetails)({length:L,beam:cls.B*STYLE_D.B,depth:H,deckAt,hull:cls.hull,band:cls.band,upgrades:{hull:3,hold:3,sails:3}});
 const bounds=new THREE.Box3();
 for(const geometry of parts){if(geometry.userData.rudder||geometry.userData.rudderSupport){scene.add(new THREE.Mesh(geometry,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})));if(geometry.userData.rudder){geometry.computeBoundingBox();bounds.union(geometry.boundingBox);}}}
 const line=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(.16,0,-L/2-1.4),new THREE.Vector3(.16,0,-L/2+2.2)]);
 scene.add(new THREE.Line(line,new THREE.LineBasicMaterial({color:'#7be8ff',depthTest:false})));
 const camera=new THREE.OrthographicCamera(-2.6,2.6,1.95,-1.95,.1,100);camera.position.set(12,2.2,-L/2-1.1);camera.lookAt(0,.45,-L/2+.25);
 renderer.setViewport(i*800,0,800,600);renderer.setScissor(i*800,0,800,600);renderer.render(scene,camera);
 measurements.push({id,blade:{minY:bounds.min.y,maxY:bounds.max.y,minZ:bounds.min.z,maxZ:bounds.max.z},displaySubmersion:-bounds.min.y*2.2});
}
window.rudderMeasurements=measurements;window.inspectionReady=true;
</script></body></html>
