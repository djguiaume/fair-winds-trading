<html><head><link rel="stylesheet" href="common.css"><script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body><canvas id="c" width="1280" height="720"></canvas><div id="labels"></div>
<div class="title"><b id="t"></b><span>Boat lineup: buy bigger ships with delivery money</span></div><div class="note" id="note"></div>
<script type="module">
import * as T from 'three';import {STYLES,makeScene,boat,wake,label,reseed} from './lib.js';
const key=new URLSearchParams(location.search).get('s')||'A',st=STYLES[key];
const notes={A:'Big bellied sails, tall rounded hulls, a colour band per ship class. Reads well at phone size.',B:'True-ish proportions, flat sails, rigging lines, muted wood and canvas.',C:'Cel shading with ink outlines and saturated colours. Outlines cost extra draw calls.'};
document.getElementById('t').textContent='Boats '+key+' · '+st.name;document.getElementById('note').textContent=notes[key];
const {r,s}=makeScene(st,c);
const cam=new T.PerspectiveCamera(34,1280/720,1,500);cam.position.set(1,30,66);cam.lookAt(1,3,0);
const list=[['sloop','Sloop','hold 10 · nimble','starter'],['cutter','Cutter','hold 16 · points high','1 500'],['schooner','Schooner','hold 30 · best upwind','5 000'],['brig','Brig','hold 50 · fast downwind','12 000'],['fluyt','Fluyt','hold 100 · slow upwind','30 000']];
const xs=[-29,-18,-5,10,27],zs=[3,-3,3,-3,3];
list.forEach(([k,n,d,p],i)=>{reseed(3+i);const rot=.75;const b=boat(st,k,{sails:2,hold:2,hull:2},.5);b.position.set(xs[i],0,zs[i]);b.rotation.y=rot;s.add(b);wake(s,b,xs[i],zs[i],rot);
 label(cam,new T.Vector3(xs[i],0,zs[i]+b.userData.L*.35+2.2),'<div class="n">'+n+'</div><br><div class="d">'+d+'</div><div class="p">'+(p==='starter'?'starter ship':'🪙 '+p)+'</div>','tag')});
r.render(s,cam);document.title='done';
</script></body></html>
