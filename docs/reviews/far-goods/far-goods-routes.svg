cargo</text><text x="1290" y="652" class="lgb">Rules</text><text x="1290" y="680" class="lg">• Three stops: the outpost gathers, the main port</text><text x="1290" y="708" class="lg">  crafts, the ring's port towns (level 4) buy.</text><text x="1290" y="736" class="lg">• No island makes the ring's goods; no two islands</text><text x="1290" y="764" class="lg">  make the same good.</text><text x="1290" y="792" class="lg">• The main port's workshop opens at town level</text><text x="1290" y="820" class="lg">  after 20 raw units from its outpost.</text><text x="1290" y="848" class="lg">• Each main port has a keeper with a 3-step arc.</text><text x="1290" y="876" class="lg">• Each crafted good: two buyers on the far side.</text><text x="1290" y="904" class="lg"></text><text x="1290" y="932" class="lgb">Estimate, maxed cutter, 30 units, one leg:</text><text x="1290" y="960" class="lg">  honey today: +811</text><text x="1290" y="988" class="lg">  ring to main port, honey or lamp oil: +600 to +670</text><text x="1290" y="1016" class="lg">  outpost to main port, raw: +350 to +500</text><text x="1290" y="1044" class="lg">  main port to ring, crafted: +1,885 to +2,525</text><text x="1290" y="1072" class="lg"></text><text x="1290" y="1100" class="lg">Order the seas open: south, west, north, east.</text>
