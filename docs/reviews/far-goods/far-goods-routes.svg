9.538252590716" y="260.36332019235624" class="lbl" text-anchor="middle">Main port</text><text x="699.538252590716" y="276.36332019235624" class="small" text-anchor="middle">makes fish, buys lamp oil</text><circle cx="906.5999999999999" cy="188.23525470213724" r="13" fill="#fff" stroke="#3f8fbf" stroke-width="3"/><text x="906.5999999999999" y="193.23525470213724" text-anchor="middle" fill="#3f8fbf" style="font:700 14px sans-serif">❄</text><text x="906.5999999999999" y="168.23525470213724" class="lbl" text-anchor="middle" fill="#3f8fbf">Outpost: Cloudberry jam 110</text><text x="383.85631534401796" y="168.26379333616944" class="biome" text-anchor="middle">NORTH · ICE</text><circle cx="669.4093293305233" cy="1070.5730035895417" r="16" fill="#f3ead0" stroke="#5c4a2a" stroke-width="2"/><text x="669.4093293305233" y="1104.5730035895417" class="lbl" text-anchor="middle">Main port</text><text x="669.4093293305233" y="1120.5730035895417" class="small" text-anchor="middle">makes timber, buys honey</text><circle cx="991.1607782058095" cy="1083.6474464929897" r="13" fill="#fff" stroke="#d0732a" stroke-width="3"/><text x="991.1607782058095" y="1088.6474464929897" text-anchor="middle" fill="#d0732a" style="font:700 14px sans-serif">✿</text><text x="991.1607782058095" y="1063.6474464929897" class="lbl" text-anchor="middle" fill="#d0732a">Outpost: Spice 90</text><text x="380.94559165474544" y="1137.210481739556" class="biome" text-anchor="middle">SOUTH · TROPICAL</text><circle cx="290.99176227487123" cy="448.5" r="16" fill="#f3ead0" stroke="#5c4a2a" stroke-width="2"/><text x="290.99176227487123" y="482.5" class="lbl" text-anchor="middle">Main port</text><text x="290.99176227487123" y="498.5" class="small" text-anchor="middle">makes stone, buys lamp oil</text><circle cx="145.51847139280392" cy="880.5805236057258" r="13" fill="#fff" stroke="#b23a2e" stroke-width="3"/><text x="145.51847139280392" y="885.5805236057258" text-anchor="middle" fill="#b23a2e" style="font:700 14px sans-serif">▲</text><text x="145.51847139280392" y="860.5805236057258" class="lbl" text-anchor="middle" fill="#b23a2e">Outpost: Obsidian 100</text><text x="157.12264854161714" y="454.90488614899306" class="biome" text-anchor="middle">WEST · FIRE</text><circle cx="1060.5730035895417" cy="679.4093293305233" r="16" fill="#f3ead0" stroke="#5c4a2a" stroke-width="2"/><text x="1060.5730035895417" y="713.4093293305233" class="lbl" text-anchor="middle">Main port</text><text x="1060.5730035895417" y="729.4093293305233" class="small" text-anchor="middle">makes grain, buys honey</text><circle cx="1132.766419852419" cy="430.60625472491336" r="13" fill="#fff" stroke="#c58a12" stroke-width="3"/><text x="1132.766419852419" y="435.60625472491336" text-anchor="middle" fill="#c58a12" style="font:700 14px sans-serif">◆</text><text x="1132.766419852419" y="410.60625472491336" class="lbl" text-anchor="middle" fill="#c58a12">Outpost: Amber 110</text><text x="1110.78765651238" y="900.3222372774368" class="biome" text-anchor="middle">EAST · FOG AND STORM</text><rect x="1270" y="20" width="560" height="1260" fill="#fbf7ec" stroke="#cbbf9f"/><text x="1290" y="64" class="title">Far goods (proposal)</text><text x="1290" y="92" class="small">Second rare set (0065, 0137). Names from the head storyteller; numbers are proposals.</text><text x="1290" y="140" style="font:700 20px sans-serif" fill="#3f8fbf">❄ Cloudberry jam, base 110</text><text x="1290" y="166" class="lg">Made at the ice outpost (from village)</text><text x="1290" y="190" class="lg">Bought by port towns Saltmere and Stonehaven</text><text x="1290" y="236" style="font:700 20px sans-serif" fill="#d0732a">✿ Spice, base 90</text><text x="1290" y="262" class="lg">Made at the tropical outpost (from village)</text><text x="1290" y="286" class="lg">Bought by port towns Port Calda and Westholm</text><text x="1290" y="332" style="font:700 20px sans-serif" fill="#b23a2e">▲ Obsidian, base 100</text><text x="1290" y="358" class="lg">Made at the fire outpost (from village)</text><text x="1290" y="382" class="lg">Bought by port towns Port Calda and Saltmere</text><text x="1290" y="428" style="font:700 20px sans-serif" fill="#c58a12">◆ Amber, base 110</text><text x="1290" y="454" class="lg">Made at the fog outpost (from village)</text><text x="1290" y="478" class="lg">Bought by port towns Westholm and Stonehaven</text><line x1="1290" y1="534" x2="1340" y2="534" stroke="#555" stroke-width="3"/><text x="1352" y="540" class="lg">far good, outpost to port town</text><line x1="1290" y1="568" x2="1340" y2="568" stroke="#6b5a3a" stroke-width="2" stroke-dasharray="7 5"/><text x="1352" y="574" class="lg">honey or lamp oil, outbound cargo</text><text x="1290" y="618" class="lgb">Rules</text><text x="1290" y="646" class="lg">• Only port towns (level 4) buy far goods.</text><text x="1290" y="674" class="lg">• Each good has two buyers on the far side of the map.</text><text x="1290" y="702" class="lg">• Each ring port town buys two far goods.</text><text x="1290" y="730" class="lg">• An outpost makes its good once it is a village,</text><text x="1290" y="758" class="lg">  like the far yards (0065).</text><text x="1290" y="786" class="lg">• Main ports sell a bulk good for founding the</text><text x="1290" y="814" class="lg">  outpost nearby, and buy honey or lamp oil.</text><text x="1290" y="842" class="lg">• Far goods do not count for the honey and lamp oil</text><text x="1290" y="870" class="lg">  gate, and add no level 5.</text><text x="1290" y="898" class="lg"></text><text x="1290" y="926" class="lgb">Estimate, full hold of 30, maxed schooner:</text><text x="1290" y="954" class="lg">  honey today      +811 in 52 s</text><text x="1290" y="982" class="lg">  spice            +1,640 in 85 s</text><text x="1290" y="1010" class="lg">  cloudberry jam, amber  +2,011 in 87 to 96 s</text>
<text x="640" y="1290" class="small" text-anchor="middle">Layout B from docs/reviews/phase-4-map; north up.</text></svg>