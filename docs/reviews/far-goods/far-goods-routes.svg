oke-width="3"/><text x="991.1607782058095" y="1088.6474464929897" text-anchor="middle" fill="#d0732a" style="font:700 14px sans-serif">✿</text><text x="991.1607782058095" y="1063.6474464929897" class="lbl" text-anchor="middle" fill="#d0732a">Outpost: gathers Spice 20</text><text x="380.94559165474544" y="1137.210481739556" class="biome" text-anchor="middle">SOUTH · TROPICAL</text><circle cx="290.99176227487123" cy="448.5" r="16" fill="#f3ead0" stroke="#5c4a2a" stroke-width="2"/><text x="290.99176227487123" y="482.5" class="lbl" text-anchor="middle" fill="#b23a2e">Main port: crafts Obsidian mirrors 100</text><text x="290.99176227487123" y="498.5" class="small" text-anchor="middle">keeper + arc; buys obsidian, lamp oil</text><circle cx="145.51847139280392" cy="880.5805236057258" r="13" fill="#fff" stroke="#b23a2e" stroke-width="3"/><text x="145.51847139280392" y="885.5805236057258" text-anchor="middle" fill="#b23a2e" style="font:700 14px sans-serif">▲</text><text x="145.51847139280392" y="860.5805236057258" class="lbl" text-anchor="middle" fill="#b23a2e">Outpost: gathers Obsidian 22</text><text x="157.12264854161714" y="454.90488614899306" class="biome" text-anchor="middle">WEST · FIRE</text><circle cx="1060.5730035895417" cy="679.4093293305233" r="16" fill="#f3ead0" stroke="#5c4a2a" stroke-width="2"/><text x="1060.5730035895417" y="713.4093293305233" class="lbl" text-anchor="middle" fill="#c58a12">Main port: crafts Amber beads 120</text><text x="1060.5730035895417" y="729.4093293305233" class="small" text-anchor="middle">keeper + arc; buys amber, honey</text><circle cx="1132.766419852419" cy="430.60625472491336" r="13" fill="#fff" stroke="#c58a12" stroke-width="3"/><text x="1132.766419852419" y="435.60625472491336" text-anchor="middle" fill="#c58a12" style="font:700 14px sans-serif">◆</text><text x="1132.766419852419" y="410.60625472491336" class="lbl" text-anchor="middle" fill="#c58a12">Outpost: gathers Amber 28</text><text x="1110.78765651238" y="900.3222372774368"