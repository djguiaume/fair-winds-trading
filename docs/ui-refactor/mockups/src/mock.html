<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UI mockups</title>
<link rel="stylesheet" href="fonts.css" />
<script src="map.js"></script>
<style>
/* ------------------------------------------------------------------ shared layout */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { position: relative; font-family: var(--body); color: var(--ink); background: #1d6f7a; }
.bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
svg.icon { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: -0.14em; }
.row { display: flex; align-items: center; gap: .4em; }
.num { font-variant-numeric: tabular-nums; }

/* size scale: phone landscape is the reference */
body { font-size: 15px; }
body[data-size="desktop"] { font-size: 18px; }
body[data-size="portrait"] { font-size: 15px; }

/* SEA HUD ------------------------------------------------------------------------ */
.hud { position: absolute; inset: 0; pointer-events: none; }
.res { position: absolute; top: 10px; left: 12px; display: flex; gap: .45em; }
.res .chip { display: flex; align-items: center; gap: .35em; padding: .25em .6em .25em .35em; font-weight: 800; }
.res .chip .icon { width: 1.35em; height: 1.35em; }
.cargobar { width: 3.2em; height: .5em; border-radius: 1em; overflow: hidden; background: var(--track); }
.cargobar i { display: block; height: 100%; width: 30%; background: var(--cargo); }
.wind { position: absolute; top: 8px; right: 10px; display: flex; flex-direction: column; align-items: center; }
.wind svg.rose { width: 7.4em; height: 7.4em; }
.wind .caption { margin-top: .1em; text-align: center; line-height: 1.15; }
.wind .caption b { display: block; }
.log { display: flex; align-items: baseline; gap: .45em; }
.log .kn { font-size: 1.25em; font-weight: 800; }
.log .eye { width: 1.05em; height: 1.05em; opacity: .7; align-self: center; }
.btns { position: absolute; left: 12px; bottom: 10px; display: flex; gap: .55em; }
.rbtn { width: 3em; height: 3em; display: grid; place-items: center; }
.rbtn .icon { width: 1.5em; height: 1.5em; }
.lever { position: absolute; right: 14px; bottom: 12px; width: 3.4em; height: 10.5em; }
.lever .track { position: absolute; left: 50%; top: .6em; bottom: .6em; width: .7em; transform: translateX(-50%); border-radius: 1em; }
.lever .notch { position: absolute; left: 0; right: 0; height: 0; }
.lever .notch span { position: absolute; right: 100%; margin-right: .35em; transform: translateY(-50%); font-size: .72em; font-weight: 800; white-space: nowrap; }
.lever .knob { position: absolute; left: 50%; transform: translate(-50%, -50%); width: 3.2em; height: 2.4em; display: grid; place-items: center; }
.lever .knob .icon { width: 1.5em; height: 1.5em; }
.sign { position: absolute; transform: translate(-50%, -100%); pointer-events: auto; display: flex; flex-direction: column; align-items: center; }
.sign .board { padding: .35em .7em .45em; text-align: center; line-height: 1.15; }
.sign .name { font-family: var(--display); font-size: 1.15em; }
.sign .wants { font-size: .85em; font-weight: 700; display: flex; gap: .3em; align-items: center; justify-content: center; white-space: nowrap; }
.sign .dock { margin-top: .3em; padding: .3em 1em; font-weight: 800; display: flex; gap: .35em; align-items: center; }
.sign .stem { width: 2px; height: 14px; }
.hullbar { position: absolute; transform: translate(-50%, 0); width: 3.6em; height: .45em; border-radius: 1em; overflow: hidden; }
.hullbar i { display: block; height: 100%; width: 74%; }
.edge { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: .4em; padding: .25em .7em; font-weight: 800; font-size: .9em; }
.edge .arrow { width: 1em; height: 1em; transform: rotate(-20deg); }
.toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); }

/* PORT ---------------------------------------------------------------------------- */
.port { position: absolute; inset: 0; display: grid; grid-template-rows: auto auto 1fr auto; }
.port .head { display: flex; align-items: center; gap: .8em; padding: .55em 1em; }
.port .title { font-family: var(--display); font-size: 1.6em; line-height: 1; }
.port .trade-tags { display: flex; gap: .5em; font-weight: 800; font-size: .85em; }
.port .tag { display: flex; align-items: center; gap: .3em; padding: .15em .55em; }
.port .tag .icon { width: 1.25em; height: 1.25em; }
.port .spacer { flex: 1; }
.port .purse { display: flex; gap: .5em; }
.port .close { width: 2.3em; height: 2.3em; display: grid; place-items: center; }
.port .tabs { display: flex; gap: .4em; padding: 0 1em; }
.port .tab { padding: .4em 1.1em; font-weight: 800; display: flex; align-items: center; gap: .4em; }
.port .tab .badge { min-width: 1.3em; height: 1.3em; border-radius: 1em; font-size: .75em; display: grid; place-items: center; }
.port .body { overflow: hidden; padding: .5em 1em; display: grid; grid-template-columns: 1fr 15em; gap: .8em; min-height: 0; }
.goods { display: grid; grid-auto-rows: 1fr; gap: .35em; min-height: 0; }
.good { display: grid; grid-template-columns: 2.3em 1fr 4.2em 4.2em 3em 9.2em; align-items: center; gap: .5em; padding: 0 .6em; }
.good .gi { width: 2.1em; height: 2.1em; }
.good .gname { font-weight: 800; line-height: 1.1; }
.good .gname small { display: block; font-weight: 600; font-size: .78em; }
.good .price { text-align: center; line-height: 1.05; }
.good .price small { display: block; font-size: .66em; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.good .price b { font-size: 1.15em; }
.good .hold { text-align: center; font-weight: 800; }
.good .hold small { display: block; font-size: .66em; text-transform: uppercase; }
.good .acts { display: flex; gap: .35em; }
.good .acts button { flex: 1; padding: .45em 0; font: inherit; font-weight: 800; }
.goods-head { display: grid; grid-template-columns: 2.3em 1fr 4.2em 4.2em 3em 9.2em; gap: .5em; padding: 0 .6em; font-size: .7em; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.side { display: flex; flex-direction: column; gap: .5em; min-height: 0; }
.card { padding: .55em .7em; }
.card h4 { font-family: var(--display); font-weight: 400; font-size: 1.05em; margin-bottom: .25em; }
.card p { font-size: .85em; line-height: 1.3; }
.port .foot { display: flex; align-items: center; gap: .6em; padding: .5em 1em .6em; }
.btn { padding: .55em 1.2em; font: inherit; font-weight: 800; display: flex; align-items: center; gap: .4em; border: 0; }

/* CHART --------------------------------------------------------------------------- */
.chart { position: absolute; inset: 0; }
.chart svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
.chart .top { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; align-items: center; gap: .6em; }
.chart .ttl { font-family: var(--display); font-size: 1.35em; }
.chart .bottom { position: absolute; bottom: 10px; left: 12px; right: 12px; display: flex; align-items: center; gap: .45em; flex-wrap: wrap; }
.chip2 { padding: .35em .75em; font-weight: 800; display: flex; gap: .35em; align-items: center; font-size: .9em; }
.chip2 .icon { width: 1.25em; height: 1.25em; }
.legend { position: absolute; left: 12px; top: 3.4em; font-size: .78em; display: flex; flex-direction: column; gap: .25em; padding: .5em .65em; }

/* PORTRAIT tweaks ------------------------------------------------------------------ */
body[data-size="portrait"] .wind svg.rose { width: 6.4em; height: 6.4em; }
body[data-size="portrait"] .res { flex-direction: column; align-items: flex-start; top: 14px; }
body[data-size="portrait"] .port .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
body[data-size="portrait"] .port .side { order: -1; flex-direction: row; }
body[data-size="portrait"] .port .side .card { flex: 1; }
body[data-size="portrait"] .good, body[data-size="portrait"] .goods-head { grid-template-columns: 2.3em 1fr 3.6em 3.6em 2.6em; row-gap: .3em; padding: .45em .6em; }
body[data-size="portrait"] .good .acts { grid-column: 1 / -1; }
body[data-size="portrait"] .goods-head span:last-child { display: none; }
body[data-size="portrait"] .goods { grid-auto-rows: auto; align-content: start; }
body[data-size="portrait"] .port .head { flex-wrap: wrap; row-gap: .4em; }
body[data-size="portrait"] .port .trade-tags { order: 5; width: 100%; }
body[data-size="portrait"] .port .tab { padding: .4em .7em; }
body[data-size="portrait"] .chart .top { flex-wrap: wrap; }
body[data-size="portrait"] .chart .top .xbtn { order: 1; }
body[data-size="portrait"] .chart .top .wchip { order: 2; }
body[data-size="portrait"] .edge { top: auto; bottom: 1.1em; }
body[data-size="portrait"] .port .foot { flex-wrap: wrap; }
body[data-size="portrait"] .port .foot .spacer { display: none; }
body[data-size="portrait"] .port .foot .btn { flex: 1; justify-content: center; }
body[data-size="portrait"] .port .foot .warn { flex: 1 1 100%; }
.plist { display: none; }
.show-desk { display: none; }
body[data-size="desktop"] .show-desk { display: block; }
body[data-size="desktop"] .hide-desk { display: none; }
.good .bestcol { display: none; font-size: .85em; line-height: 1.2; }
.good .bestcol small { display: block; font-size: .78em; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
body[data-size="desktop"] .good { grid-template-columns: 2.3em 1fr 10em 4.2em 4.2em 3em 9.2em; }
body[data-size="desktop"] .good .bestcol { display: block; }
body[data-size="desktop"] .goods { grid-auto-rows: 4.4em; align-content: start; }
body[data-size="portrait"] .plist { display: block; position: absolute; left: 12px; right: 12px; bottom: 8.6em; }
.plist table { width: 100%; border-collapse: collapse; font-size: .9em; }
.plist td { padding: .2em .3em; }
.plist td:nth-child(2), .plist td:nth-child(3) { text-align: right; font-weight: 800; }

/* =================================================================== STYLE A: storybook */
body[data-style="a"] {
  --display: 'Fraunces', serif; --body: 'Nunito', sans-serif;
  --ink: #3b2414; --track: #c9ab7c; --cargo: #6b8f3a;
  --parch: #f3e3c0; --parch2: #e8d2a6; --wood: #7a4a26; --wood2: #5b3418; --gold: #e9b33a; --red: #b9432f; --green: #5f8f2e;
  --fish: #4f8fb8; --grain: #d6a73a; --timber: #9a6234; --stone: #8f8e8a; --coin: #e9b33a; --crate: #a36d3d; --hull: #b9432f;
}
body[data-style="a"] .chip, body[data-style="a"] .board, body[data-style="a"] .card, body[data-style="a"] .edge,
body[data-style="a"] .chip2, body[data-style="a"] .legend {
  background: var(--parch); border: 3px solid var(--wood); border-radius: 10px;
  box-shadow: 0 3px 0 var(--wood2), 0 6px 14px rgba(40, 20, 5, .35);
}
body[data-style="a"] .wind { background: var(--parch); border: 3px solid var(--wood); border-radius: 50% 50% 14px 14px; padding: .35em .45em .45em; box-shadow: 0 3px 0 var(--wood2), 0 6px 14px rgba(40,20,5,.35); }
body[data-style="a"] .rbtn { background: radial-gradient(circle at 40% 35%, #9a6234, var(--wood2)); color: var(--parch); border: 3px solid #3d220e; border-radius: 50%; box-shadow: 0 3px 0 #2c180a; }
body[data-style="a"] .lever .track { background: linear-gradient(90deg, #5b3418, #8b5a30, #5b3418); border: 2px solid #3d220e; }
body[data-style="a"] .lever .notch span { color: var(--parch); text-shadow: 0 1px 2px #2c180a, 0 0 4px #2c180a; }
body[data-style="a"] .lever .knob { background: var(--parch); border: 3px solid var(--wood); border-radius: 12px; box-shadow: 0 3px 0 var(--wood2); color: var(--wood); }
body[data-style="a"] .dock { background: var(--green); color: #fff7e6; border: 2px solid #3d5c1c; border-radius: 8px; box-shadow: 0 3px 0 #3d5c1c; }
body[data-style="a"] .stem { background: var(--wood); }
body[data-style="a"] .hullbar { background: #3d220e; border: 2px solid #3d220e; }
body[data-style="a"] .hullbar i { background: #e0a43a; }
body[data-style="a"] .log { color: var(--ink); font-size: .85em; font-weight: 700; }
body[data-style="a"] .wind svg.rose { width: 6.2em; height: 6.2em; }
body[data-style="a"] .wind .caption b { display: inline; margin-right: .3em; }
body[data-style="a"] .wind .caption { color: var(--ink); font-size: .82em; }
body[data-style="a"] .port { background: rgba(40,22,8,.35); }
body[data-style="a"] .port .head { background: linear-gradient(#8b5a30, #6b3f1f); color: var(--parch); border-bottom: 4px solid #3d220e; }
body[data-style="a"] .port .title { color: #ffe3a0; text-shadow: 0 2px 0 #3d220e; }
body[data-style="a"] .port .tag { background: rgba(255, 240, 210, .16); border-radius: 6px; }
body[data-style="a"] .port .head .chip { color: var(--ink); }
body[data-style="a"] .port .close { background: var(--parch); color: var(--wood); border-radius: 50%; border: 3px solid #3d220e; }
body[data-style="a"] .port .tabs { background: #6b3f1f; padding-top: .35em; }
body[data-style="a"] .port .tab { background: #a77a4a; color: #3d220e; border-radius: 10px 10px 0 0; border: 2px solid #3d220e; border-bottom: 0; }
body[data-style="a"] .port .tab.on { background: var(--parch); }
body[data-style="a"] .port .tab .badge { background: var(--red); color: #fff; }
body[data-style="a"] .port .body { background: var(--parch); }
body[data-style="a"] .good { background: #fbf0d6; border: 2px solid #c9ab7c; border-radius: 10px; }
body[data-style="a"] .good.want { border-color: #d6a73a; background: #fff3cf; }
body[data-style="a"] .good small { color: #7a5a3a; }
body[data-style="a"] .goods-head { color: #7a5a3a; }
body[data-style="a"] .acts button { border-radius: 8px; border: 2px solid; }
body[data-style="a"] .acts .buy { background: #f6d77a; border-color: #a77a1a; color: #4a3008; box-shadow: 0 2px 0 #a77a1a; }
body[data-style="a"] .acts .sell { background: #b7d68a; border-color: #4f7a22; color: #22380b; box-shadow: 0 2px 0 #4f7a22; }
body[data-style="a"] .acts .off { background: #eadcbc; border-color: #c9ab7c; color: #a89070; box-shadow: none; }
body[data-style="a"] .best { color: var(--green); }
body[data-style="a"] .port .foot { background: #6b3f1f; border-top: 4px solid #3d220e; }
body[data-style="a"] .btn { border-radius: 10px; }
body[data-style="a"] .btn.pri { background: var(--gold); color: #3d220e; box-shadow: 0 3px 0 #9a6a10; }
body[data-style="a"] .btn.sec { background: var(--parch); color: #3d220e; box-shadow: 0 3px 0 #9a7a50; }
body[data-style="a"] .btn.warn { background: #f2c2a8; color: #6b1f10; box-shadow: 0 3px 0 #9a4a30; }
body[data-style="a"] .chart { background: #e9d6ac; }
body[data-style="a"] .chart .ttl { color: var(--wood2); }
body[data-style="a"] .chip2.on { background: var(--gold); }
body[data-style="a"] .xbtn { background: var(--parch); border: 3px solid var(--wood); border-radius: 50%; width: 2.4em; height: 2.4em; display: grid; place-items: center; color: var(--wood); margin-left: auto; box-shadow: 0 3px 0 var(--wood2); }

/* =================================================================== STYLE B: bold badges */
body[data-style="b"] {
  --display: 'Lilita One', sans-serif; --body: 'Nunito', sans-serif;
  --ink: #fff; --track: rgba(0,0,0,.45); --cargo: #ffcf3a;
  --fish: #4fc3f7; --grain: #ffd54a; --timber: #c98a4b; --stone: #b8c2cc; --coin: #ffc928; --crate: #d99a52; --hull: #ff5a4a;
}
body[data-style="b"] .chip { background: rgba(10, 30, 40, .78); border: 3px solid #0b1a22; border-radius: 99px; font-family: var(--display); font-weight: 400; font-size: 1.12em; letter-spacing: .02em; text-shadow: 0 2px 0 #0b1a22; padding-right: .8em; }
body[data-style="b"] .wind { filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
body[data-style="b"] .wind .caption { font-family: var(--display); text-shadow: 0 2px 0 #0b1a22, 0 0 6px rgba(0,0,0,.5); letter-spacing: .02em; }
body[data-style="b"] .wind .caption b { color: #ffd54a; font-weight: 400; font-size: 1.15em; }
body[data-style="b"] .log .kn { font-family: var(--display); font-weight: 400; }
body[data-style="b"] .log { background: rgba(10,30,40,.8); border: 2px solid #0b1a22; border-radius: 99px; padding: .1em .7em; margin-top: .25em; font-weight: 800; font-size: .9em; }
body[data-style="b"] .rbtn { background: #ffc928; color: #4a2a00; border: 3px solid #0b1a22; border-radius: 16px; box-shadow: inset 0 -4px 0 #d89a00, 0 3px 0 rgba(0,0,0,.4); }
body[data-style="b"] .rbtn.blue { background: #3fb6f0; color: #04263a; box-shadow: inset 0 -4px 0 #1b7fb3, 0 3px 0 rgba(0,0,0,.4); }
body[data-style="b"] .lever .track { background: rgba(10,30,40,.78); border: 3px solid #0b1a22; }
body[data-style="b"] .lever .notch span { font-family: var(--display); font-weight: 400; color: #fff; text-shadow: 0 2px 0 #0b1a22, 0 0 4px #0b1a22; }
body[data-style="b"] .lever .knob { background: #fff; border: 3px solid #0b1a22; border-radius: 14px; box-shadow: inset 0 -4px 0 #c9d6de, 0 3px 0 rgba(0,0,0,.4); color: #0b1a22; }
body[data-style="b"] .board { background: none; }
body[data-style="b"] .sign .name { font-size: 1.3em; text-shadow: 0 2px 0 #0b1a22, 0 0 6px #0b1a22; }
body[data-style="b"] .sign .wants { background: rgba(10,30,40,.8); border: 2px solid #0b1a22; border-radius: 99px; padding: .15em .6em; }
body[data-style="b"] .dock { background: #59d36b; color: #0b2a12; border: 3px solid #0b1a22; border-radius: 14px; box-shadow: inset 0 -4px 0 #2f9c41; font-family: var(--display); font-weight: 400; font-size: 1.05em; letter-spacing: .03em; }
body[data-style="b"] .stem { display: none; }
body[data-style="b"] .hullbar { background: #300; border: 2px solid #0b1a22; height: .6em; }
body[data-style="b"] .hullbar i { background: linear-gradient(#ff7a6a, #e02a1a); }
body[data-style="b"] .edge { background: rgba(10,30,40,.8); border: 3px solid #0b1a22; border-radius: 99px; font-family: var(--display); font-weight: 400; letter-spacing: .02em; }
body[data-style="b"] .port { background: linear-gradient(180deg, rgba(5,40,55,.55), rgba(5,25,35,.92) 40%); color: #fff; }
body[data-style="b"] .port .title { font-size: 2em; color: #ffd54a; text-shadow: 0 3px 0 #0b1a22; }
body[data-style="b"] .port .tag { background: rgba(10,30,40,.8); border: 2px solid #0b1a22; border-radius: 99px; }
body[data-style="b"] .port .purse .chip { font-size: 1em; }
body[data-style="b"] .port .close { background: #ff5a4a; border: 3px solid #0b1a22; border-radius: 12px; box-shadow: inset 0 -3px 0 #b8261a; }
body[data-style="b"] .port .tab { background: rgba(255,255,255,.12); border: 3px solid #0b1a22; border-radius: 14px; font-family: var(--display); font-weight: 400; letter-spacing: .03em; }
body[data-style="b"] .port .tab.on { background: #3fb6f0; color: #04263a; box-shadow: inset 0 -4px 0 #1b7fb3; }
body[data-style="b"] .port .tab .badge { background: #ff5a4a; color: #fff; font-family: var(--body); font-weight: 900; }
body[data-style="b"] .good { background: rgba(255,255,255,.08); border: 3px solid rgba(0,0,0,.45); border-radius: 16px; }
body[data-style="b"] .good.want { background: rgba(255, 213, 74, .14); border-color: #ffd54a; }
body[data-style="b"] .good .gname { font-family: var(--display); font-weight: 400; font-size: 1.12em; letter-spacing: .02em; }
body[data-style="b"] .good small, body[data-style="b"] .goods-head { color: #a9d6e5; }
body[data-style="b"] .good .price b { font-family: var(--display); font-weight: 400; font-size: 1.3em; }
body[data-style="b"] .acts button { border: 3px solid #0b1a22; border-radius: 12px; font-family: var(--display) !important; font-weight: 400 !important; letter-spacing: .03em; }
body[data-style="b"] .acts .buy { background: #ffc928; color: #4a2a00; box-shadow: inset 0 -4px 0 #d89a00; }
body[data-style="b"] .acts .sell { background: #59d36b; color: #0b2a12; box-shadow: inset 0 -4px 0 #2f9c41; }
body[data-style="b"] .acts .off { background: rgba(255,255,255,.12); color: rgba(255,255,255,.4); }
body[data-style="b"] .best { color: #7dff8c; }
body[data-style="b"] .card { background: rgba(255,255,255,.08); border: 3px solid rgba(0,0,0,.45); border-radius: 16px; }
body[data-style="b"] .card h4 { color: #ffd54a; letter-spacing: .02em; }
body[data-style="b"] .btn { border: 3px solid #0b1a22; border-radius: 14px; font-family: var(--display); font-weight: 400; letter-spacing: .03em; font-size: 1.05em; }
body[data-style="b"] .btn.pri { background: #ffc928; color: #4a2a00; box-shadow: inset 0 -4px 0 #d89a00; }
body[data-style="b"] .btn.sec { background: #59d36b; color: #0b2a12; box-shadow: inset 0 -4px 0 #2f9c41; }
body[data-style="b"] .btn.warn { background: #ff5a4a; color: #fff; box-shadow: inset 0 -4px 0 #b8261a; }

/* =================================================================== STYLE C: instruments */
body[data-style="c"] {
  --display: 'Barlow Condensed', sans-serif; --body: 'Barlow', sans-serif;
  --ink: #eef3f4; --track: rgba(255,255,255,.18); --cargo: #e8c46a;
  --navy: rgba(9, 28, 41, .82); --line: rgba(232, 196, 106, .55); --brass: #e8c46a;
  --fish: #eef3f4; --grain: #eef3f4; --timber: #eef3f4; --stone: #eef3f4; --coin: #e8c46a; --crate: #eef3f4; --hull: #ff8a6a;
}
body[data-style="c"] .chip, body[data-style="c"] .edge, body[data-style="c"] .card, body[data-style="c"] .chip2, body[data-style="c"] .legend {
  background: var(--navy); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(4px);
}
body[data-style="c"] .chip { font-family: var(--display); font-weight: 600; font-size: 1.1em; letter-spacing: .03em; }

body[data-style="c"] .port .close { border: 1px solid var(--line); border-radius: 6px; }
body[data-style="c"] .port .tabs { padding-top: .5em; }

body[data-style="c"] .acts .buy { background: transparent; color: var(--brass); border-color: var(--brass); }
body[data-style="c"] .acts .sell { background: var(--brass); color: #0d2230; border-color: var(--brass); }

body[data-style="c"] .xbtn { background: var(--navy); border: 1px solid var(--line); border-radius: 6px; width: 2.4em; height: 2.4em; display: grid; place-items: center; margin-left: auto; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="var(--coin)" stroke="rgba(0,0,0,.45)" stroke-width="1.5"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="1.5"/></symbol>
    <symbol id="i-crate" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="var(--crate)" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/><path d="M3 9h18M3 15h18M6 4l12 16" stroke="rgba(0,0,0,.4)" stroke-width="1.5" fill="none"/></symbol>
    <symbol id="i-hull" viewBox="0 0 24 24"><path d="M2 10h20l-3 8c-.4 1.2-1.5 2-2.8 2H7.8c-1.3 0-2.4-.8-2.8-2z" fill="var(--hull)" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/><path d="M12 10V3l6 6" stroke="currentColor" stroke-width="1.6" fill="none"/></symbol>

    <symbol id="i-grain" viewBox="0 0 24 24"><path d="M12 22V6" stroke="rgba(0,0,0,.5)" stroke-width="1.6"/><g fill="var(--grain)" stroke="rgba(0,0,0,.45)" stroke-width="1.2"><ellipse cx="12" cy="4" rx="2" ry="3"/><ellipse cx="8.5" cy="9" rx="2" ry="3" transform="rotate(-30 8.5 9)"/><ellipse cx="15.5" cy="9" rx="2" ry="3" transform="rotate(30 15.5 9)"/><ellipse cx="8.5" cy="14" rx="2" ry="3" transform="rotate(-30 8.5 14)"/><ellipse cx="15.5" cy="14" rx="2" ry="3" transform="rotate(30 15.5 14)"/></g></symbol>
    <symbol id="i-timber" viewBox="0 0 24 24"><g fill="var(--timber)" stroke="rgba(0,0,0,.5)" stroke-width="1.4"><rect x="3" y="12" width="18" height="7" rx="3.5"/><rect x="3" y="5" width="18" height="7" rx="3.5"/></g><g fill="#f0d29a" stroke="rgba(0,0,0,.45)" stroke-width="1.2"><circle cx="18" cy="8.5" r="2.6"/><circle cx="18" cy="15.5" r="2.6"/></g></symbol>

    <symbol id="i-anchor" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M7 11h10M4 14c1 4 4 7 8 7s7-3 8-7"/></g></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>

    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 2l8 18-8-5-8 5z" fill="currentColor"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6 3h12v15a3 3 0 0 1-3 3H5a2 2 0 0 1-2-2v-2h12v2a2 2 0 0 0 2 2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z" fill="currentColor"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></symbol>
  </defs>
</svg>
<div class="bg" id="bg"></div>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const style = q.get('style') || 'a', screen = q.get('screen') || 'sea', size = q.get('size') || 'landscape';
document.body.dataset.style = style; document.body.dataset.size = size;
const I = (id, cls = '') => `<svg class="icon ${cls}"><use href="#i-${id}"/></svg>`;
// Screen positions of the pier and the boat in each background capture (from the game's camera).
const POS = { landscape: { pier: [528, 235], boat: [391, 177] }, desktop: { pier: [933, 559], boat: [576, 382] }, portrait: { pier: null, boat: [135, 387] } };
const root = document.getElementById('root');
const W = innerWidth, H = innerHeight;

function rose() {
  // North-up compass rose: no-go wedge around the wind, wind arrow, boat, target tick.
  const windFrom = 30, heading = 125, target = 345, s = style;
  const ring = { a: ['#f8ecd0', '#7a4a26', '#3b2414'], b: ['rgba(10,30,40,.85)', '#0b1a22', '#fff'], c: ['rgba(9,28,41,.0)', 'rgba(232,196,106,.7)', '#eef3f4'] }[s];
  const nogo = { a: 'rgba(185,67,47,.35)', b: 'rgba(255,70,60,.55)', c: 'rgba(255,120,100,.35)' }[s];
  const wind = { a: '#2f7fb0', b: '#ffd54a', c: '#e8c46a' }[s];
  const boat = { a: '#5b3418', b: '#fff', c: '#eef3f4' }[s];
  const good = { a: '#5f8f2e', b: '#59d36b', c: '#8fe3a4' }[s];
  const pt = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [Math.cos(a) * r, Math.sin(a) * r]; };
  const arc = (from, to, r) => { const [x1, y1] = pt(from, r), [x2, y2] = pt(to, r); return `M0 0 L${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2} Z`; };
  let ticks = '';
  for (let d = 0; d < 360; d += 15) { const [x1, y1] = pt(d, 40), [x2, y2] = pt(d, d % 90 ? 37 : 34); ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ring[2]}" stroke-opacity=".6" stroke-width="${d % 90 ? 1 : 2}"/>`; }
  const lbl = ['N', 'E', 'S', 'W'].map((t, i) => { const [x, y] = pt(i * 90, 27); return `<text x="${x}" y="${y + 3.5}" text-anchor="middle" font-size="9" font-weight="800" fill="${ring[2]}" font-family="var(--display)">${t}</text>`; }).join('');
  const [tx, ty] = pt(target, 44);
  // good-angle band on the rim: beam to broad reach on the current tack
  const band = `<path d="${arc(windFrom + 70, windFrom + 150, 46)}" fill="none"/><path d="M${pt(windFrom + 70, 46)} A46 46 0 0 1 ${pt(windFrom + 150, 46)}" stroke="${good}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  return `<svg class="rose" viewBox="-50 -50 100 100">
    <circle r="45" fill="${ring[0]}" stroke="${ring[1]}" stroke-width="${s === 'c' ? 1 : 3}"/>
    ${band}
    <path d="${arc(windFrom - 45, windFrom + 45, 40)}" fill="${nogo}"/>
    ${ticks}${lbl}
    <g transform="rotate(${windFrom})"><path d="M0 -44 L7 -30 L2 -32 L2 -14 L-2 -14 L-2 -32 L-7 -30 Z" fill="${wind}" stroke="rgba(0,0,0,.5)" stroke-width="1" transform="rotate(180 0 -29)"/></g>
    <g transform="rotate(${heading})"><path d="M0 -15 L6 8 L0 4 L-6 8 Z" fill="${boat}" stroke="rgba(0,0,0,.5)" stroke-width="1"/></g>
    <circle cx="${tx}" cy="${ty}" r="3.6" fill="${s === 'a' ? '#b9432f' : '#ff5a4a'}" stroke="#fff" stroke-width="1"/>
  </svg>`;
}

function sea() {
  document.getElementById('bg').style.backgroundImage = `url(bg/sea-${size}.png)`;
  const p = POS[size];
  const sign = p.pier ? `<div class="sign" style="left:${p.pier[0]}px;top:${p.pier[1] - 6}px">
      <div class="board"><div class="name">${I('anchor')} Saltmere</div><div class="wants">wants ${I('timber')} 23 ${I('coin')}</div></div>
      <div class="dock">${I('anchor')} Dock</div><div class="stem"></div></div>` : '';
  const hull = `<div class="hullbar" style="left:${p.boat[0]}px;top:${p.boat[1] - (size === 'desktop' ? 58 : 44)}px"><i></i></div>`;
  root.innerHTML = `<div class="hud">
    <div class="res">
      <div class="chip">${I('coin')}<span class="num">120</span></div>
      <div class="chip">${I('crate')}<span class="cargobar"><i></i></span><span class="num">3/10</span></div>
      <div class="chip">${I('hull')}<span class="num">74%</span></div>
    </div>
    <div class="edge">${I('arrow', 'arrow')} Port Calda <span class="num">1.9 nm</span></div>
    <div class="wind">${rose()}<div class="caption"><b>Fresh</b> NE 15 kn</div>
      <div class="log"><span class="kn num">6.8</span><span>kn</span><span class="pos">Beam reach</span>${I('eye', 'eye')}</div></div>
    ${sign}${hull}
    <div class="btns"><div class="rbtn">${I('menu')}</div><div class="rbtn blue">${I('map')}</div></div>
    <div class="lever"><div class="track"></div>
      <div class="notch" style="top:10%"><span>Full</span></div><div class="notch" style="top:50%"><span>Half</span></div><div class="notch" style="top:90%"><span>Down</span></div>
      <div class="knob" style="top:10%">${I('sail')}</div></div>
  </div>`;
  // Style C keeps the log under the caption; A and B under the rose.
}

const GOODS = [
  { id: 'fish', name: 'Fish', note: 'made here', stock: 97, buy: 9, sell: 6, hold: 3, best: 'Port Calda 11', want: false },
  { id: 'grain', name: 'Grain', note: 'wanted · order 7', stock: 16, buy: 18, sell: 14, hold: 0, best: 'Stonehaven 19', want: true },
  { id: 'timber', name: 'Timber', note: 'wanted', stock: 22, buy: 30, sell: 23, hold: 0, best: 'Saltmere pays most', want: true },
  { id: 'stone', name: 'Stone', note: '', stock: 40, buy: 21, sell: 15, hold: 0, best: 'Port Calda 28', want: false },
];
function port() {
  document.getElementById('bg').style.backgroundImage = `url(bg/port-${size}.png)`;
  const rows = GOODS.map((g) => `<div class="good ${g.want ? 'want' : ''}">
      ${I(g.id, 'gi')}
      <div class="gname">${g.name}<small>${g.note || '&nbsp;'}</small></div>
      <div class="bestcol"><small>best elsewhere</small>${g.best}</div>
      <div class="price"><small>buy</small><b class="num">${g.buy}</b></div>
      <div class="price"><small>sell</small><b class="num ${g.want ? 'best' : ''}">${g.sell}</b></div>
      <div class="hold num">${g.hold}<small>hold</small></div>
      <div class="acts"><button class="buy">Buy</button><button class="${g.hold ? 'sell' : 'sell off'}">Sell</button></div>
    </div>`).join('');
  root.innerHTML = `<div class="port">
    <div class="head">
      <div class="title">Saltmere</div>
      <div class="trade-tags"><span class="tag">makes ${I('fish')}</span><span class="tag">wants ${I('timber')}${I('grain')}</span></div>
      <div class="spacer"></div>
      <div class="purse res" style="position:static"><div class="chip">${I('coin')}<span class="num">120</span></div><div class="chip">${I('crate')}<span class="cargobar"><i></i></span><span class="num">3/10</span></div></div>
      <div class="close">${I('x')}</div>
    </div>
    <div class="tabs"><div class="tab on">Market</div><div class="tab">Orders <span class="badge">1</span></div><div class="tab">Shipyard</div></div>
    <div class="body">
      <div class="goods">${rows}</div>
      <div class="side">
        <div class="card"><h4>${I('scroll')} Order here</h4><p><b>7 grain</b> → <b>210</b> ${I('coin')}<br>Westholm sells grain at 8.</p></div>
        <div class="card show-desk"><h4>${I('crate')} Your hold</h4><p>3 fish of 10 · bought at 9<br>Sloop · sails L1 · hold L1 · hull L1</p></div>
        <div class="card hide-desk"><h4>Best elsewhere</h4><p>${I('fish')} Port Calda pays <b class="best">11</b><br>${I('grain')} Stonehaven pays <b class="best">19</b></p></div>
      </div>
    </div>
    <div class="foot">
      <div class="btn warn">${I('hull')} Repair 74% → 100 · 40 ${I('coin')}</div>
      <div class="spacer" style="flex:1"></div>
      <div class="btn sec">Sell all · 18 ${I('coin')}</div>
      <div class="btn pri">${I('sail')} Set sail</div>
    </div>
  </div>`;
}

function chart() {
  const M = window.MAP, R = M.boundsRadius;
  const colours = {
    a: { sea: '#cfe3d6', sea2: '#b8d6c9', land: '#e7cf96', landS: '#8a6436', reef: '#c7724f', text: '#3b2414', line: '#9a6234', you: '#2f6fa0', pin: '#b9432f', grid: 'rgba(90,60,30,.18)' },
    b: { sea: '#2aa7b3', sea2: '#1f8a96', land: '#f2d28a', landS: '#0b1a22', reef: '#ff8a6a', text: '#fff', line: '#ffd54a', you: '#fff', pin: '#ff5a4a', grid: 'rgba(255,255,255,.08)' },
    c: { sea: '#123a4d', sea2: '#0e2b3a', land: '#2c5566', landS: '#e8c46a', reef: '#ff8a6a', text: '#eef3f4', line: '#e8c46a', you: '#8fe3a4', pin: '#ff8a6a', grid: 'rgba(232,196,106,.12)' },
  }[style];
  const blob = (x, y, r, seed) => { let d = ''; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, k = 1 + .14 * Math.sin(seed * 7 + i * 2.3); d += `${i ? 'L' : 'M'}${(x + Math.cos(a) * r * k).toFixed(1)} ${(-y + Math.sin(a) * r * k).toFixed(1)}`; } return d + 'Z'; };
  let g = '';
  for (let r = 100; r < R + 50; r += 100) g += `<circle r="${r}" fill="none" stroke="${colours.grid}" stroke-width="1.5"/>`;
  for (let a = 0; a < 360; a += 30) { const t = a * Math.PI / 180; g += `<line x1="0" y1="0" x2="${Math.sin(t) * (R + 40)}" y2="${-Math.cos(t) * (R + 40)}" stroke="${colours.grid}" stroke-width="1.5"/>`; }
  let land = '';
  for (const t of M.terrain) {
    const pts = t.outline.map(([x, y]) => `${x},${-y}`).join(' ');
    land += t.kind === 'reef' ? `<polygon points="${pts}" fill="${colours.reef}" fill-opacity=".45" stroke="${colours.reef}" stroke-dasharray="4 3" stroke-width="2"/>`
      : `<polygon points="${pts}" fill="${colours.land}" stroke="${colours.landS}" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  M.islands.forEach((i, n) => { land += `<path d="${blob(i.x, i.y, i.radius, n + 1)}" fill="${colours.land}" stroke="${colours.landS}" stroke-width="2.5"/>`; });
  // Prices for the selected good (grain): illustrative numbers.
  const price = { calda: 'sells 15', saltmere: 'sells 14', westholm: 'buy 8', stonehaven: 'sells 19' };
  const tagOf = { westholm: 'cheapest', stonehaven: 'pays most' };
  const fs = size === 'portrait' ? 30 : 32;
  let pins = '';
  for (const p of M.ports) {
    const isl = M.islands.find((i) => i.id === p.islandId);
    const x = isl.x, y = -isl.y, up = y < 0 ? 1 : -1;
    const ly = y + up * (isl.radius + fs * 1.6) + (up > 0 ? fs * 0.9 : -fs * 0.6);
    const hot = tagOf[p.id];
    pins += `<g>
      <line x1="${x}" y1="${y}" x2="${x}" y2="${ly - up * 14}" stroke="${colours.text}" stroke-opacity=".5" stroke-width="1.5"/>
      <rect x="${x - fs * 5.6}" y="${ly - fs * 1.05}" width="${fs * 11.2}" height="${fs * 2.6}" rx="${style === 'c' ? 5 : 12}" fill="${style === 'a' ? '#f3e3c0' : style === 'b' ? 'rgba(10,30,40,.85)' : 'rgba(9,28,41,.9)'}" stroke="${hot ? colours.line : style === 'a' ? '#7a4a26' : 'rgba(255,255,255,.25)'}" stroke-width="${hot ? 3.5 : 2}"/>
      <text x="${x}" y="${ly + fs * .2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${style === 'a' ? '#3b2414' : '#fff'}" style="font-family:var(--display)">${p.name}</text>
      <text x="${x}" y="${ly + fs * 1.3}" text-anchor="middle" font-size="${fs * .8}" font-weight="700" fill="${hot ? (style === 'a' ? '#5f8f2e' : '#8fe3a4') : style === 'a' ? '#7a5a3a' : '#c9d7dc'}">grain ${price[p.id]}${hot ? ' · ' + hot : ''}</text>
    </g>`;
  }
  const names = M.islands.filter((i) => i.name && !M.ports.some((p) => p.islandId === i.id)).map((i) => `<text x="${i.x}" y="${-i.y - i.radius - 8}" text-anchor="middle" font-size="22" font-style="italic" fill="${colours.text}" fill-opacity=".75">${i.name}</text>`).join('')
    + M.terrain.filter((t) => t.name).map((t) => { const xs = t.outline.map((p) => p[0]); const ys = t.outline.map((p) => -p[1]); return `<text x="${(Math.min(...xs) + Math.max(...xs)) / 2}" y="${(Math.min(...ys) + Math.max(...ys)) / 2 + 4}" text-anchor="middle" font-size="22" font-style="italic" fill="${style === 'c' ? '#e8c46a' : colours.text}" fill-opacity=".85">${t.name}</text>`; }).join('');
  const you = [250, 110];
  const calda = M.islands.find((i) => i.id === 'calda');
  const route = `<path d="M${you[0]} ${you[1]} L${calda.x} ${-calda.y + 30}" stroke="${colours.line}" stroke-width="3" stroke-dasharray="9 7" fill="none"/>`;
  const boat = `<g transform="translate(${you[0]} ${you[1]}) rotate(125) scale(1.4)"><path d="M0 -12 L7 8 L0 4 L-7 8 Z" fill="${colours.you}" stroke="rgba(0,0,0,.6)" stroke-width="1.5"/></g>`;
  const marker = `<g transform="translate(-40 40)" color="${colours.pin}"><use href="#i-pin" x="-14" y="-28" width="28" height="28"/></g>`;
  const windArrows = [[-330, -300], [-200, -330], [330, -300]].map(([x, y]) => `<g transform="translate(${x} ${y}) rotate(210) scale(1.8)"><path d="M0 -18 L6 -4 L2 -6 L2 14 L-2 14 L-2 -6 L-6 -4 Z" fill="${colours.line}" fill-opacity=".7"/></g>`).join('');
  const ext = R + 60;
  const vb = size === 'portrait' ? `${-ext} ${-ext * 1.5} ${ext * 2} ${ext * 2.6}` : `${-ext * 1.7} ${-ext * 1.16} ${ext * 3.4} ${ext * 2.32}`;
  root.innerHTML = `<div class="chart">
    <svg class="map" viewBox="${vb}" preserveAspectRatio="${size === 'portrait' ? 'xMidYMin' : 'xMidYMid'} meet">
      <rect x="-2000" y="-2000" width="4000" height="4000" fill="${colours.sea2}"/>
      <circle r="${R}" fill="${colours.sea}" stroke="${colours.line}" stroke-opacity=".6" stroke-width="2.5" stroke-dasharray="${style === 'c' ? '0' : '10 8'}"/>
      ${g}${windArrows}${land}${names}${route}${pins}${boat}${marker}
    </svg>
    <div class="top">
      <div class="ttl">Sea chart</div>
      <div class="chip2 wchip">${I('arrow')} NE wind · 15 kn</div>
      <div class="chip2 wchip">Course to Port Calda · 1.9 nm</div>
      <div class="xbtn">${I('x')}</div>
    </div>
    <div class="plist card"><h4>${I('grain')} Grain prices</h4><table>
      <tr><td>Westholm</td><td class="best">buy 8</td><td>sell 6</td><td>cheapest</td></tr>
      <tr><td>Stonehaven</td><td>—</td><td class="best">sell 19</td><td>pays most</td></tr>
      <tr><td>Port Calda</td><td>buy 20</td><td>sell 15</td><td></td></tr>
      <tr><td>Saltmere</td><td>buy 18</td><td>sell 14</td><td>you are here</td></tr></table></div>
    <div class="bottom">
      <div class="chip2">${I('fish')} Fish</div><div class="chip2 on">${I('grain')} Grain</div><div class="chip2">${I('timber')} Timber</div><div class="chip2">${I('stone')} Stone</div>
      <div style="flex:1"></div>
      <div class="chip2">${I('pin')} Mark here</div><div class="chip2">Clear course</div>
    </div>
  </div>`;
}

({ sea, port, chart })[screen]();
if (style === 'c' && screen === 'sea') {
  // Instrument style: the log sits in its own box under the wind caption.
  const log = document.querySelector('.log');
  Object.assign(log.style, { position: 'absolute', top: 'calc(100% + 2.3em)', right: '0', fontSize: '.9em', background: 'var(--navy)', border: '1px solid var(--line)', borderRadius: '6px', padding: '.15em .6em', whiteSpace: 'nowrap' });
}
</script>
</body>
</html>
