<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta

      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#efe6d1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Fair Winds Trading</title>
    <meta
      name="description"
      content="A low-poly 3D browser sailing and trading game with ports, goods, dynamic market economy, shipyard upgrades, and navigation."
    />
    <meta property="og:title" content="Fair Winds Trading" />
    <meta
      property="og:description"
      content="A low-poly 3D browser sailing and trading game with ports, goods, dynamic market economy, shipyard upgrades, and navigation."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/ui/fonts.css" />
    <link rel="stylesheet" href="/src/ui/identity/logo.css" />
    <link rel="stylesheet" href="/src/ui/page.css" />
    <link rel="stylesheet" href="/src/ui/home.css" />
    <link rel="stylesheet" href="/src/ui/pad.css" />
    <link rel="stylesheet" href="/src/ui/tutorialCoach.css" />
  </head>
  <body>
    <!-- prettier-ignore -->
    <div id="splash" role="status"><svg class="splash-logo" viewBox="0 0 300 216" aria-hidden="true"><svg x="90" y="0" width="120" height="120" viewBox="0 0 120 120"><g style="fill:none;stroke:none;stroke-width:2;stroke-linejoin:round"><circle cx="60" cy="60" r="55.2"/><path d="M60 8c10 -2 22 -6 30 -2l-6 6 8 4c-10 2-22 0-32 -2z"/></g><circle cx="60" cy="60" r="54" style="fill:none;stroke:#23303a;stroke-width:2.4"/><circle cx="60" cy="60" r="46" style="fill:none;stroke:#23303a;stroke-width:1"/><g transform="rotate(0 60 60)"><path style="fill:#23303a;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 8 66 54.6z"/><path style="fill:#efe6d1;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 8 54 54.6z"/></g><g transform="rotate(90 60 60)"><path style="fill:#23303a;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 8 66 54.6z"/><path style="fill:#efe6d1;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 8 54 54.6z"/></g><g transform="rotate(180 60 60)"><path style="fill:#23303a;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 8 66 54.6z"/><path style="fill:#efe6d1;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 8 54 54.6z"/></g><g transform="rotate(270 60 60)"><path style="fill:#23303a;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 8 66 54.6z"/><path style="fill:#efe6d1;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 8 54 54.6z"/></g><g transform="rotate(45 60 60)"><path style="fill:#23303a;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 27.759999999999998 64.2 56.22z"/><path style="fill:#efe6d1;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 27.759999999999998 55.8 56.22z"/></g><g transform="rotate(135 60 60)"><path style="fill:#23303a;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 27.759999999999998 64.2 56.22z"/><path style="fill:#efe6d1;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 27.759999999999998 55.8 56.22z"/></g><g transform="rotate(225 60 60)"><path style="fill:#23303a;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 27.759999999999998 64.2 56.22z"/><path style="fill:#efe6d1;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 27.759999999999998 55.8 56.22z"/></g><g transform="rotate(315 60 60)"><path style="fill:#23303a;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 27.759999999999998 64.2 56.22z"/><path style="fill:#efe6d1;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round" d="M60 60 60 27.759999999999998 55.8 56.22z"/></g><circle cx="60" cy="60" r="4" style="fill:#4a6d41;stroke:#23303a;stroke-width:1.4"/><path d="M60 8c10 -2 22 -6 30 -2l-6 6 8 4c-10 2-22 0-32 -2z" style="fill:#4a6d41;stroke:#23303a;stroke-width:1.2;stroke-linejoin:round"/></svg><svg x="0" y="124" width="300" height="60" viewBox="-4 -78 458 92"><text textLength="450" lengthAdjust="spacingAndGlyphs" style="font:400 100px 'IM Fell English',Georgia,serif;fill:#23303a;stroke:none;stroke-width:3;stroke-linejoin:round;paint-order:stroke">Fair Winds</text></svg><svg x="60" y="192" width="180" height="24" viewBox="0 0 300 40"><path d="M14 6h272l-12 14 12 14H14l12-14z" style="fill:none;stroke:none;stroke-width:3;stroke-linejoin:round"/><path d="M14 6h272l-12 14 12 14H14l12-14z" style="fill:#4a6d41;stroke:#23303a;stroke-width:1.6;stroke-linejoin:round"/><text x="150" y="27" text-anchor="middle" textLength="150" lengthAdjust="spacingAndGlyphs" style="font:italic 400 22px 'IM Fell English',Georgia,serif;fill:#efe6d1">Trading Company</text></svg></svg><p class="splash-tag" id="splash-tag">Read the wind, carry the cargo, find a home.</p><div class="splash-sea" aria-hidden="true"><svg class="splash-wave splash-wave--track" viewBox="0 0 300 40" preserveAspectRatio="none"><path d="M0 24q12.5 -10 25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0"/></svg><svg class="splash-wave splash-wave--fill" viewBox="0 0 300 40" preserveAspectRatio="none"><path d="M0 24q12.5 -10 25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0t25 0"/></svg><svg class="splash-boat" viewBox="0 0 36 36"><path class="splash-boat-sail" d="M18 5 30 23H18zM16 10V23H6z"/><path class="splash-boat-hull" d="M3 25H33L28 32H9z"/></svg></div><p class="splash-status" id="splash-status">Hoisting sail</p></div>
    <div id="stage">
      <canvas id="scene"></canvas>
      <div id="haze-veil" class="haze-veil" aria-hidden="true"></div>
      <div id="press-glow" class="press-glow" data-press="0" aria-hidden="true"></div>
    </div>
    <div id="hud">
      <div id="home-ui"></div>
      <div id="tutorial-sea"></div>
      <div id="boat-labels" class="port-labels-layer"></div>
      <div id="port-labels" class="port-labels-layer"></div>
      <div id="hull-bar" class="hull-bar" hidden><i></i></div>

      <div id="wp-arrow" class="wp-arrow" hidden>
        <span
          ><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg
        ></span>
      </div>
      <button id="quest-note" class="quest-note" type="button" hidden></button>
      <div id="tiller" class="tiller" hidden><i></i></div>
      <div id="fps" class="fps" hidden></div>
    </div>

    <!-- The sea chart (issue #444): built by src/ui/chart/layout.ts. -->
    <dialog
      id="chart"
      class="chart"
      aria-label="Sea chart"
      data-i18n-attr="aria-label:chart.title"
    ></dialog>
    <div id="trade-panel" class="trade-panel-overlay" hidden></div>
    <!-- A person's card for a quest (decision 0124), filled by src/ui/questCard.ts. -->
    <dialog id="quest-card" class="quest-card" data-pad-hints="off"></dialog>

    <script type="module" src="/src/boot.ts"></script>
    <!-- A game controller's button hints in menus and on cards (decision 0163). -->
    <div id="pad-hints" class="pad-hints" popover="manual" aria-hidden="true">
      <span
        ><i class="pad-key a" data-pad-key="a">A</i><span data-i18n="pad.choose">Choose</span></span
      >
      <span><i class="pad-key b" data-pad-key="b">B</i><span data-i18n="pad.back">Back</span></span>
    </div>
  </body>
</html>
