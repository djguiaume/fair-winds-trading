<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fair Winds Trading · Map editor</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="ed-top" id="ed-top">
      <h1>Map editor</h1>
      <select id="ed-sea" class="ed-sea" title="Which sea to edit (decision 0156)">
        <option value="phase4">The game's sea</option>
        <option value="ring">Windward Ring alone</option>
      </select>
      <span class="ed-file"
        ><b id="ed-map-name"></b> · <span id="ed-file-name">phase1-map.json</span>
        <span id="ed-edited" hidden>· ● edited</span></span
      >
      <nav class="ed-actions">
        <button id="ed-undo" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button id="ed-redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
        <button id="ed-reset" title="Back to the map shipped with the game">Reset</button>
        <button id="ed-import" title="Open a map .json file">Import</button>
        <button id="ed-quests" title="The quest builder: every quest, its steps, places and text">
          Quests
        </button>
        <button
          id="ed-controls"
          title="The controls: pad buttons in each place, TV mode, pad makers' button names"
        >
          Controls
        </button>
        <button id="ed-sounds" title="The sounds: effects, each sea's bed, the boat, bells, music">
          Sounds
        </button>
        <button id="ed-regatta" title="The regatta: horn, medals, lines, Kestrel, series, pennants">
          Regatta
        </button>
        <button
          id="ed-cosmetics"
          title="Boat cosmetics: sail colours, emblems, figureheads, flags, wakes"
        >
          Cosmetics
        </button>
        <button id="ed-free" title="Free Sailing presets: where, when, weather and ship">
          Free Sailing
        </button>
        <button id="ed-play" title="Open the game on this map in a new tab">▶ Play this map</button>
        <button id="ed-export" class="primary">Export map.json</button>
        <a href="./" title="The game">Game</a>
        <input id="ed-file" type="file" accept=".json,application/json" hidden />
      </nav>
    </header>
    <main class="ed-main" id="ed-main">
      <aside class="ed-tools" id="ed-tools" aria-label="Tools"></aside>
      <section class="ed-chart">
        <svg id="ed-map" tabindex="0" aria-label="Map"></svg>
        <div class="ed-toggles" id="ed-toggles"></div>
        <div class="ed-zoom">
          <button id="ed-zoom-in" aria-label="Zoom in">+</button>
          <button id="ed-zoom-out" aria-label="Zoom out">−</button>
          <button id="ed-zoom-fit" aria-label="Fit the map">⤢</button>
        </div>
        <p class="ed-hint" id="ed-hint"></p>
      </section>
      <aside class="ed-panel">
        <div id="ed-props"></div>
        <div class="ed-check-box">
          <h2>Checks</h2>
          <ul id="ed-checks" class="ed-checks"></ul>
          <p class="ed-note">Same checks as the test suite, run in the page.</p>
        </div>
      </aside>
    </main>
    <div id="ib" class="ib" hidden>
      <header class="ed-top">
        <h1>Island builder</h1>
        <span class="ed-file"
          ><span id="ib-map-name"></span> › <b id="ib-name"></b> <span id="ib-file"></span>
          <span id="ib-edited" hidden>· ● edited</span></span
        >
        <nav class="ed-actions">
          <button id="ib-back" title="Back to the map (Esc with nothing selected)">
            ← <span class="ib-long">Back to the map</span><span class="ib-short">Map</span>
          </button>
          <button id="ib-undo" title="Undo (Ctrl+Z)">↶<span class="ib-long"> Undo</span></button>
          <button id="ib-redo" title="Redo (Ctrl+Shift+Z)">
            ↷<span class="ib-long"> Redo</span>
          </button>
          <button id="ib-reset" title="Back to the island shipped with the game">Reset</button>
          <button id="ib-import" title="Open an island .json file">Import</button>
          <button id="ib-play" title="Open the game with this island in a new tab">
            ▶ Play<span class="ib-long"> this island</span>
          </button>
          <button id="ib-export" class="primary">Export</button>
          <input id="ib-input" type="file" accept=".json,application/json" hidden />
        </nav>
      </header>
      <main class="ib-main" data-tab="props">
        <aside class="ib-palette" aria-label="Tools">
          <div class="ib-modes ib-seg" id="ib-modes">
            <button data-mode="props">Props</button>
            <button data-mode="ground">Ground</button>
            <button data-mode="lanes">Lanes</button>
            <button data-mode="terrain">Terrain</button>
            <button data-mode="spots" title="Build spots: where the captain builds (home islands)">
              Spots
            </button>
          </div>
          <div class="ib-selbar" id="ib-selbar" hidden></div>
          <div class="ib-prop-tools" id="ib-prop-tools">
            <input id="ib-search" type="search" placeholder="Find a prop…" />
            <div class="ib-groups" id="ib-groups"></div>
            <div class="ib-tiles" id="ib-tiles"></div>
          </div>
          <div class="ib-shape-tools" id="ib-shape-tools" hidden></div>
        </aside>
        <section class="ib-view" id="ib-view">
          <canvas id="ib-canvas"></canvas>
          <svg id="ib-svg" tabindex="0" aria-label="Island"></svg>
          <div class="ib-levels">
            <span>Level</span>
            <div class="ib-seg" id="ib-levels"></div>
            <label
              ><input type="checkbox" id="ib-later" checked />
              <span class="ib-long">Show later levels</span
              ><span class="ib-short">Later</span></label
            >
          </div>
          <div class="ed-toggles ib-toggles" id="ib-toggles"></div>
          <div class="ed-zoom">
            <button id="ib-zoom-in" aria-label="Zoom in">+</button>
            <button id="ib-zoom-out" aria-label="Zoom out">−</button>
            <button id="ib-zoom-fit" aria-label="Fit the island">⤢</button>
          </div>
          <p class="ed-hint" id="ib-hint"></p>
          <div class="ib-preview-slot" id="ib-preview-corner"></div>
        </section>
        <aside class="ib-side">
          <div id="ib-panel" class="ib-panel"></div>
          <div class="ib-preview-slot" id="ib-preview-side">
            <div class="ib-preview" id="ib-preview">
              <canvas id="ib-preview-canvas"></canvas>
              <span class="ib-preview-title" id="ib-preview-title">3D preview</span>
              <span class="ib-preview-hint" id="ib-preview-hint">drag to turn</span>
              <div class="ib-preview-tools">
                <button
                  id="ib-night"
                  type="button"
                  title="See the island at night"
                  aria-pressed="false"
                >
                  ☾ Night
                </button>
                <button
                  id="ib-reset-view"
                  type="button"
                  title="Back to the game camera's view"
                  hidden
                >
                  ⟲
                </button>
                <button
                  id="ib-expand"
                  type="button"
                  title="Bigger 3D view (Esc closes)"
                  aria-label="Bigger 3D view"
                >
                  ⤢
                </button>
              </div>
            </div>
          </div>
          <div class="ib-checks">
            <h2>Checks <small>same code as the tests</small></h2>
            <ul id="ib-checks" class="ed-checks"></ul>
          </div>
        </aside>
        <nav class="ib-tabs" id="ib-tabs">
          <button data-tab="select">Select</button>
          <button data-tab="props" data-mode="props">Props</button>
          <button data-tab="props" data-mode="ground">Ground</button>
          <button data-tab="props" data-mode="lanes">Lanes</button>
          <button data-tab="props" data-mode="terrain">Terrain</button>
          <button data-tab="select" data-mode="spots">Spots</button>
          <button data-tab="checks">Checks <b id="ib-tab-count"></b></button>
        </nav>
      </main>
    </div>
    <div id="qb" class="qb" hidden></div>
    <div id="cp" class="cp" hidden></div>
    <div id="sd" class="cp" hidden></div>
    <div id="rg" class="cp" hidden></div>
    <div id="cs" class="cp" hidden></div>
    <div id="fp" class="cp" hidden></div>
    <script type="module" src="/src/editor/editor.ts"></script>
  </body>
</html>
