<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fair Winds Trading · Model sheet</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1d6f7a;
        font:
          14px/1.3 system-ui,
          sans-serif;
        color: #fff;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      header {
        position: absolute;
        top: 12px;
        left: 16px;
        text-shadow: 0 1px 3px #0008;
      }
      header h1 {
        margin: 0;
        font-size: 22px;
      }
      header a {
        color: #ffe9a8;
        margin-right: 10px;
      }
      #stats {
        position: absolute;
        top: 12px;
        right: 16px;
        background: #0005;
        padding: 6px 10px;
        border-radius: 8px;
      }
      .label {
        position: absolute;
        transform: translate(-50%, 0);
        background: #123c44cc;
        padding: 4px 10px;
        border-radius: 8px;
        text-align: center;
        white-space: nowrap;
      }
      .label small {
        display: block;
        color: #ffe9a8;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <header>
      <h1 id="title">Model sheet</h1>
      <a href="?view=boats">Boats</a><a href="?view=islands">Islands</a><a href="./">Game</a>
    </header>
    <div id="stats"></div>
    <div id="labels"></div>
    <script type="module" src="/src/modelSheet.ts"></script>
  </body>
</html>
