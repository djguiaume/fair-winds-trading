name: Graphify

# Rebuilds the code graph on main and keeps it as an artifact for two weeks, so a broken graph is
# noticed here and not in a thread. Threads still run `graphify update .` themselves first.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: graphify
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g graphifyy
      - run: graphify update .
      - uses: actions/upload-artifact@v4
        with:
          name: graphify
          path: .graphify
          retention-days: 14
