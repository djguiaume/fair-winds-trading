<!-- Level cards and Settings buttons as index.html had them before decision 0111. -->
<div id="level-cards" class="level-cards" role="radiogroup" aria-labelledby="level-title">
  <button type="button" role="radio" class="level-card" data-level="fair" aria-checked="false">
    <span class="level-top">
      <svg class="level-waves" viewBox="0 0 46 34" aria-hidden="true" style="color: #8fe3a4">
        <use href="#i-level-wave" y="20" />
      </svg>
      <span class="level-name" data-i18n="level.fair"></span>
    </span>
    <span class="level-tag" data-i18n="level.fairTag"></span>
    <ul>
      <li data-i18n="level.fair1"></li>
      <li data-i18n="level.fair2"></li>
      <li data-i18n="level.fair3"></li>
      <li class="extra" data-i18n="level.fair4"></li>
      <li class="extra" data-i18n="level.fair5"></li>
    </ul>
  </button>
  <button type="button" role="radio" class="level-card" data-level="captain" aria-checked="false">
    <span class="level-badge" data-i18n="level.asDesigned">Standard</span>
    <span class="level-top">
      <svg class="level-waves" viewBox="0 0 46 34" aria-hidden="true" style="color: #e8c46a">
        <use href="#i-level-wave" y="13" />
        <use href="#i-level-wave" y="25" />
      </svg>
      <span class="level-name" data-i18n="level.captain"></span>
    </span>
    <span class="level-tag" data-i18n="level.captainTag"></span>
    <ul>
      <li data-i18n="level.captain1"></li>
      <li data-i18n="level.captain2"></li>
      <li data-i18n="level.captain3"></li>
      <li class="extra" data-i18n="level.captain4"></li>
      <li class="extra" data-i18n="level.captain5"></li>
    </ul>
  </button>
  <button type="button" role="radio" class="level-card" data-level="salt" aria-checked="false">
    <span class="level-top">
      <svg class="level-waves" viewBox="0 0 46 34" aria-hidden="true" style="color: #ff8a73">
        <use href="#i-level-wave" y="8" />
        <use href="#i-level-wave" y="18" />
        <use href="#i-level-wave" y="28" />
      </svg>
      <span class="level-name" data-i18n="level.salt"></span>
    </span>
    <span class="level-tag" data-i18n="level.saltTag"></span>
    <ul>
      <li data-i18n="level.salt1"></li>
      <li data-i18n="level.salt2"></li>
      <li data-i18n="level.salt3"></li>
      <li class="extra" data-i18n="level.salt4"></li>
    </ul>
  </button>
</div>
<div id="difficulty" class="seg" role="radiogroup" aria-labelledby="difficulty-label">
  <button type="button" role="radio" data-level="fair" data-i18n="level.fair">Fair winds</button>
  <button type="button" role="radio" data-level="captain" data-i18n="level.captain">Captain</button>
  <button type="button" role="radio" data-level="salt" data-i18n="level.salt">Old salt</button>
</div>
